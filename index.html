<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Tiny Magic Dino — Bana 2: LINDENGARD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(180deg, #ffe9c1 0%, #ffd6a0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    color: #5b3a1f;
    overflow-x: hidden;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 14px;
    opacity: 0.7;
    margin-bottom: 14px;
  }
  .hud {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .letter-slot {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff8e1;
    border: 2px dashed #c9a45c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c9a45c;
    font-weight: 800;
    font-size: 16px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s, color 0.25s, border-color 0.25s;
  }
  .letter-slot.filled {
    background: #ffd54f;
    border-color: #f9a825;
    border-style: solid;
    color: #5b3a1f;
    transform: scale(1.18) rotate(-4deg);
    box-shadow: 0 4px 12px rgba(249, 168, 37, 0.4);
  }
  canvas {
    border: 4px solid #5b3a1f;
    border-radius: 12px;
    background: linear-gradient(180deg, #aee1f9 0%, #d8efff 65%, #ffe9c1 100%);
    display: block;
    box-shadow: 0 12px 30px rgba(91, 58, 31, 0.25);
    max-width: 100%;
  }
  .instructions {
    margin-top: 14px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.5);
    padding: 8px 14px;
    border-radius: 20px;
  }
  .instructions kbd {
    background: #5b3a1f;
    color: #fff;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-family: monospace;
    margin: 0 2px;
  }
  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(91, 58, 31, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    overflow: hidden;
  }
  .win-overlay.show { display: flex; }
  .win-card {
    background: #fff;
    padding: 36px 48px;
    border-radius: 24px;
    text-align: center;
    transform: scale(0);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    max-width: 90vw;
  }
  @keyframes pop {
    to { transform: scale(1); }
  }
  .win-card h2 {
    color: #2e7d32;
    font-size: 36px;
    margin-bottom: 8px;
  }
  .win-card p {
    color: #5b3a1f;
    font-size: 16px;
  }
  .win-card .word {
    font-size: 44px;
    font-weight: 900;
    color: #f9a825;
    letter-spacing: 8px;
    margin: 18px 0;
    text-shadow: 2px 2px 0 rgba(245, 124, 0, 0.3);
  }
  .win-card .dino-celebration {
    font-size: 48px;
    margin-top: 10px;
    animation: bounce 0.7s ease-in-out infinite alternate;
    display: inline-block;
  }
  @keyframes bounce {
    from { transform: translateY(0) rotate(-5deg); }
    to { transform: translateY(-10px) rotate(5deg); }
  }
  .confetti {
    position: absolute;
    width: 10px;
    height: 14px;
    pointer-events: none;
    border-radius: 2px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.8; }
  }
</style>
</head>
<body>
  <h1>Tiny Magic Dino</h1>
  <div class="subtitle">Bana 2 — Samla bokstäverna</div>
  <div class="hud" id="hud"></div>
  <canvas id="game" width="800" height="400"></canvas>
  <p class="instructions">
    Hoppa <kbd>Space</kbd> eller <kbd>↑</kbd> &nbsp;·&nbsp;
    Spring <kbd>←</kbd> <kbd>→</kbd>
  </p>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <h2>Du klarade banan!</h2>
      <p>Du samlade ordet</p>
      <div class="word">LINDENGARD</div>
      <div class="dino-celebration">🦕</div>
      <p style="margin-top: 10px; font-size: 14px; opacity: 0.7;">Tryck R för att spela igen</p>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const WORLD_W = 2600;
const GROUND_Y = 340;
const GRAVITY = 0.55;
const JUMP_POWER = -11.5;
const MOVE_SPEED = 3.6;

// Ground segments (two gaps between them)
const groundSegs = [
  { x: 0,    w: 600 },
  { x: 740,  w: 540 },
  { x: 1410, w: 1200 },
];

const platforms = [
  { x: 270,  y: 250, w: 80, h: 14 },
  { x: 920,  y: 225, w: 80, h: 14 },
  { x: 1680, y: 250, w: 80, h: 14 },
];

const flag = { x: 2470, y: 240, w: 6, h: 100 };

// Letters: L I N D E N G A R D
const WORD = "LINDENGARD";
const letterPositions = [
  { char: 'L', x: 130,  y: 305 },
  { char: 'I', x: 310,  y: 220 }, // on platform
  { char: 'N', x: 500,  y: 305 },
  { char: 'D', x: 800,  y: 305 },
  { char: 'E', x: 960,  y: 195 }, // on platform
  { char: 'N', x: 1180, y: 305 },
  { char: 'G', x: 1500, y: 305 },
  { char: 'A', x: 1720, y: 220 }, // on platform
  { char: 'R', x: 1920, y: 305 },
  { char: 'D', x: 2250, y: 305 },
];

let letters = [];
let player = {};
let camera = { x: 0 };
let gameWon = false;

function reset() {
  player = { x: 60, y: 280, vx: 0, vy: 0, w: 36, h: 46, onGround: false, facing: 1 };
  camera.x = 0;
  letters = letterPositions.map(l => ({ ...l, collected: false }));
  gameWon = false;
  document.getElementById('winOverlay').classList.remove('show');
  document.querySelectorAll('.confetti').forEach(c => c.remove());
  buildHUD();
}

function buildHUD() {
  const hud = document.getElementById('hud');
  hud.innerHTML = '';
  for (let i = 0; i < WORD.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'letter-slot';
    slot.textContent = WORD[i];
    slot.style.opacity = '0.5';
    hud.appendChild(slot);
  }
}

function updateHUD() {
  const slots = document.querySelectorAll('.letter-slot');
  let collectedCount = 0;
  for (let i = 0; i < WORD.length; i++) {
    if (letters[i].collected) {
      slots[i].classList.add('filled');
      slots[i].style.opacity = '1';
      collectedCount++;
    }
  }
}

// Input
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && gameWon) reset();
  if (['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function update() {
  if (gameWon) return;

  // Horizontal input
  if (keys['ArrowLeft']) { player.vx = -MOVE_SPEED; player.facing = -1; }
  else if (keys['ArrowRight']) { player.vx = MOVE_SPEED; player.facing = 1; }
  else player.vx = 0;

  // Jump
  if ((keys['Space'] || keys['ArrowUp']) && player.onGround) {
    player.vy = JUMP_POWER;
    player.onGround = false;
  }

  // Gravity
  player.vy += GRAVITY;
  if (player.vy > 14) player.vy = 14;

  // Apply velocity
  player.x += player.vx;
  player.y += player.vy;

  if (player.x < 0) player.x = 0;
  if (player.x > WORLD_W - player.w) player.x = WORLD_W - player.w;

  // Collisions (top-only landing)
  player.onGround = false;

  // Ground
  for (const g of groundSegs) {
    if (player.x + player.w > g.x && player.x < g.x + g.w) {
      const playerBottom = player.y + player.h;
      const prevBottom = playerBottom - player.vy;
      if (playerBottom >= GROUND_Y && prevBottom <= GROUND_Y + 1 && player.vy >= 0) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  // Platforms
  for (const p of platforms) {
    if (player.x + player.w > p.x && player.x < p.x + p.w) {
      const playerBottom = player.y + player.h;
      const prevBottom = playerBottom - player.vy;
      if (playerBottom >= p.y && prevBottom <= p.y + 1 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  // Fell into a gap
  if (player.y > H + 100) {
    // Soft reset: respawn at start, keep collected letters (friendly for kids)
    player.x = 60;
    player.y = 200;
    player.vx = 0;
    player.vy = 0;
  }

  // Letter collection
  for (const letter of letters) {
    if (letter.collected) continue;
    const px = player.x + player.w / 2;
    const py = player.y + player.h / 2;
    const dx = px - letter.x;
    const dy = py - letter.y;
    if (Math.abs(dx) < 26 && Math.abs(dy) < 28) {
      letter.collected = true;
      updateHUD();
    }
  }

  // Flag check
  if (player.x + player.w > flag.x - 8 && player.x < flag.x + 40 &&
      player.y + player.h > flag.y && player.y < flag.y + flag.h) {
    if (letters.every(l => l.collected)) {
      win();
    }
  }

  // Camera follow
  camera.x = player.x + player.w / 2 - W / 2;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > WORLD_W - W) camera.x = WORLD_W - W;
}

function drawCloud(x, y, scale = 1) {
  ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 16 * scale, 0, Math.PI * 2);
  ctx.arc(x + 18 * scale, y - 6 * scale, 22 * scale, 0, Math.PI * 2);
  ctx.arc(x + 40 * scale, y, 18 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawHill(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(x, y, w, h, 0, Math.PI, 0);
  ctx.fill();
}

function drawTree(x, y) {
  // Trunk
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(x - 4, y - 30, 8, 30);
  // Foliage
  ctx.fillStyle = '#43a047';
  ctx.beginPath();
  ctx.arc(x, y - 40, 18, 0, Math.PI * 2);
  ctx.arc(x - 10, y - 32, 14, 0, Math.PI * 2);
  ctx.arc(x + 10, y - 32, 14, 0, Math.PI * 2);
  ctx.fill();
}

function drawDino(x, y, facing) {
  ctx.save();
  if (facing === -1) {
    ctx.translate(x + 36, y);
    ctx.scale(-1, 1);
    x = 0;
    y = 0;
  } else {
    x = x;
  }

  // Tail
  ctx.fillStyle = '#66bb6a';
  ctx.beginPath();
  ctx.moveTo(x + 0, y + 28);
  ctx.lineTo(x + 12, y + 22);
  ctx.lineTo(x + 12, y + 34);
  ctx.closePath();
  ctx.fill();

  // Body
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(x + 8, y + 18, 22, 22);
  // Belly
  ctx.fillStyle = '#c5e1a5';
  ctx.fillRect(x + 12, y + 24, 16, 14);

  // Head
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(x + 18, y + 4, 18, 20);
  // Snout
  ctx.fillRect(x + 30, y + 14, 8, 8);

  // Spikes on back
  ctx.fillStyle = '#43a047';
  ctx.beginPath();
  ctx.moveTo(x + 12, y + 18);
  ctx.lineTo(x + 16, y + 12);
  ctx.lineTo(x + 20, y + 18);
  ctx.moveTo(x + 20, y + 18);
  ctx.lineTo(x + 24, y + 12);
  ctx.lineTo(x + 28, y + 18);
  ctx.fill();

  // Eye
  ctx.fillStyle = 'white';
  ctx.beginPath();
  ctx.arc(x + 28, y + 12, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(x + 29, y + 13, 2, 0, Math.PI * 2);
  ctx.fill();

  // Smile
  ctx.strokeStyle = '#5b3a1f';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + 31, y + 19);
  ctx.lineTo(x + 35, y + 20);
  ctx.stroke();

  // Cheek blush
  ctx.fillStyle = 'rgba(255, 138, 128, 0.6)';
  ctx.beginPath();
  ctx.arc(x + 26, y + 17, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.fillStyle = '#66bb6a';
  ctx.fillRect(x + 12, y + 40, 6, 6);
  ctx.fillRect(x + 22, y + 40, 6, 6);

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Sun
  ctx.fillStyle = 'rgba(255, 235, 130, 0.9)';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 38, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 235, 130, 0.3)';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 56, 0, Math.PI * 2);
  ctx.fill();

  // Parallax clouds
  drawCloud(200 - camera.x * 0.25, 70, 1);
  drawCloud(550 - camera.x * 0.25, 50, 0.8);
  drawCloud(900 - camera.x * 0.25, 90, 1.1);
  drawCloud(1400 - camera.x * 0.25, 60, 0.9);
  drawCloud(1900 - camera.x * 0.25, 80, 1);

  // Background hills (parallax)
  drawHill(400 - camera.x * 0.5, GROUND_Y, 280, 80, '#a5d6a7');
  drawHill(1000 - camera.x * 0.5, GROUND_Y, 350, 110, '#a5d6a7');
  drawHill(1700 - camera.x * 0.5, GROUND_Y, 300, 90, '#a5d6a7');
  drawHill(2300 - camera.x * 0.5, GROUND_Y, 320, 100, '#a5d6a7');

  // Ground segments
  for (const g of groundSegs) {
    // Soil
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(g.x - camera.x, GROUND_Y, g.w, H - GROUND_Y);
    // Grass top
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(g.x - camera.x, GROUND_Y, g.w, 10);
    // Grass tufts
    ctx.fillStyle = '#558b2f';
    for (let i = 0; i < g.w; i += 30) {
      ctx.fillRect(g.x - camera.x + i, GROUND_Y - 2, 3, 4);
      ctx.fillRect(g.x - camera.x + i + 8, GROUND_Y - 1, 2, 3);
    }
  }

  // Trees for charm (only on segment 1 and 3)
  drawTree(70 - camera.x, GROUND_Y);
  drawTree(2400 - camera.x, GROUND_Y);

  // Platforms
  for (const p of platforms) {
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(p.x - camera.x, p.y, p.w, p.h);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(p.x - camera.x, p.y, p.w, 5);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(p.x - camera.x, p.y + p.h, p.w, 3);
  }

  // Letters
  const t = Date.now() / 300;
  for (const letter of letters) {
    if (letter.collected) continue;
    const x = letter.x - camera.x;
    const y = letter.y + Math.sin(t + letter.x * 0.01) * 4;
    // Glow
    const gradient = ctx.createRadialGradient(x, y, 8, x, y, 28);
    gradient.addColorStop(0, 'rgba(255, 213, 79, 0.7)');
    gradient.addColorStop(1, 'rgba(255, 213, 79, 0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI * 2);
    ctx.fill();
    // Coin
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#f9a825';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Letter
    ctx.fillStyle = '#5b3a1f';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(letter.char, x, y + 1);
  }

  // Flag
  const fx = flag.x - camera.x;
  // Pole
  ctx.fillStyle = '#5b3a1f';
  ctx.fillRect(fx, flag.y, 4, flag.h);
  // Triangle flag
  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.moveTo(fx + 4, flag.y);
  ctx.lineTo(fx + 42, flag.y + 14);
  ctx.lineTo(fx + 4, flag.y + 28);
  ctx.closePath();
  ctx.fill();
  // Flag highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(fx + 4, flag.y + 2);
  ctx.lineTo(fx + 26, flag.y + 10);
  ctx.lineTo(fx + 4, flag.y + 8);
  ctx.fill();
  // Flag base
  ctx.fillStyle = '#5b3a1f';
  ctx.beginPath();
  ctx.arc(fx + 2, flag.y + flag.h, 6, 0, Math.PI, true);
  ctx.fill();

  // Dino
  drawDino(player.x - camera.x, player.y, player.facing);

  // Subtle hint arrow when player hasn't moved (encouragement)
  if (player.x < 100 && !gameWon) {
    const pulse = (Math.sin(Date.now() / 200) + 1) / 2;
    ctx.fillStyle = `rgba(91, 58, 31, ${0.4 + pulse * 0.4})`;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('→ börja här', player.x - camera.x + 50 + pulse * 6, player.y + 10);
  }
}

function win() {
  if (gameWon) return;
  gameWon = true;
  document.getElementById('winOverlay').classList.add('show');
  spawnConfetti();
}

function spawnConfetti() {
  const colors = ['#e53935', '#fb8c00', '#ffd54f', '#66bb6a', '#42a5f5', '#ab47bc', '#ec407a'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.background = colors[i % colors.length];
    el.style.left = (Math.random() * 100) + 'vw';
    el.style.top = '-30px';
    el.style.transform = `rotate(${Math.random() * 360}deg)`;
    el.style.animationDuration = (2 + Math.random() * 2.5) + 's';
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(el);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
